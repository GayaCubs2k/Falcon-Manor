<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Falcon Manor CMS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root { --paper: #F6F4EF; --sand: #ECE8E0; --line: rgba(23, 48, 47, .12); --ink: #17302F; --text: #474A4F; --muted: #7E8185; --midnight: #224D51; --deep: #132B2D; --terra: #BB614A; --terra-deep: #A04F3A; --gold: #B0945C; --ok: #3E7B55; --warn: #A86A1F; --bad: #B03A2E; --f-display: "Fraunces", Georgia, serif; --f-body: "Montserrat", "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
#app { min-height: 100%; display: flex; flex-direction: column; }
#app > * { flex: 1 0 auto; }
body { background: var(--paper); color: var(--text); font: 14px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; color: var(--ink); margin: 0; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--terra-deep); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* sign-in */
.gate { min-height: 100%; display: grid; place-items: center; padding: 24px; background: var(--deep) radial-gradient(120% 90% at 15% 0%, #2C5D61 0%, #1B3D40 50%, #132B2D 100%); }
.gate-card { width: min(420px, 100%); background: #fff; padding: 36px 32px 30px; box-shadow: 0 40px 90px -40px rgba(0, 0, 0, .6); }
.gate-card .mark { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.gate-card .mark img { width: 52px; }
.gate-card .mark b { font: 600 13px/1.2 var(--f-body); letter-spacing: .26em; color: var(--midnight); }
.gate-card h1 { font-size: 30px; }
.gate-card p { margin: 8px 0 20px; color: var(--muted); }
.gate-card ol { padding-left: 18px; margin: 14px 0 0; }
.gate-card ol li { margin: 8px 0; }
.gate-card code { background: var(--sand); padding: 1px 6px; font-size: 12.5px; }
/* shell */
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--deep); color: #C9D4D0; padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; color: #F4F1EA; text-decoration: none; }
.side .brand img { width: 40px; filter: brightness(0) invert(1); opacity: .9; }
.side .brand b { font: 600 11.5px/1.25 var(--f-body); letter-spacing: .24em; }
.side .brand small { display: block; font-weight: 500; letter-spacing: .12em; color: var(--gold); margin-top: 3px; }
.side h4 { margin: 14px 10px 6px; font: 600 10.5px/1 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: #7F9A95; }
.side button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; border: 0; background: none; color: inherit; cursor: pointer; border-left: 3px solid transparent; }
.side button:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.side button[aria-current="page"] { background: rgba(255, 255, 255, .1); color: #fff; border-left-color: var(--terra); }
.side .count { font: 600 11px/1 var(--f-body); background: var(--terra); color: #fff; padding: 3px 7px; border-radius: 999px; }
.side .grow { flex: 1; }
.main { min-width: 0; display: flex; flex-direction: column; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 26px; background: rgba(246, 244, 239, .94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .state { margin-right: auto; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; color: var(--ink); }
.bar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.bar .dirty .dot { background: var(--warn); }
.menu-btn { display: none; }
.content { padding: 28px 26px 80px; max-width: 1120px; width: 100%; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.head h1 { font-size: 34px; }
.head p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; font-weight: 600; font-size: 12.5px; white-space: nowrap; text-decoration: none; transition: background .2s, border-color .2s, color .2s; }
.btn:hover { border-color: rgba(23, 48, 47, .3); }
.btn.primary { background: var(--terra); border-color: var(--terra); color: #fff; }
.btn.primary:hover { background: var(--terra-deep); border-color: var(--terra-deep); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { height: 30px; padding: 0 12px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--terra-deep); cursor: pointer; font-weight: 600; font-size: 12px; padding: 0; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font: 600 11.5px/1.2 var(--f-body); letter-spacing: .06em; color: var(--ink); text-transform: uppercase; }
.field small { color: var(--muted); font-size: 12px; }
input[type="text"], input[type="email"], input[type="url"], input[type="tel"], input[type="password"], input[type="search"], input[type="date"], input[type="number"], select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: #fff; outline: none; border-radius: 0; transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus, textarea:focus { border-color: var(--midnight); box-shadow: 0 0 0 3px rgba(34, 77, 81, .12); }
textarea { min-height: 70px; resize: vertical; line-height: 1.55; }
.card { background: #fff; border: 1px solid var(--line); padding: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font: 600 10.5px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; background: var(--sand); color: var(--ink); }
.chip.ok { background: #E1EFE5; color: var(--ok); } .chip.warn { background: #F7EBD8; color: var(--warn); } .chip.bad { background: #F6E1DE; color: var(--bad); } .chip.new { background: #F3DED6; color: var(--terra-deep); }
.muted { color: var(--muted); }
.empty { padding: 34px; text-align: center; color: var(--muted); border: 1px dashed var(--line); background: rgba(255, 255, 255, .6); }
/* dashboard */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat h3 { font-size: 15px; font-family: var(--f-body); font-weight: 600; letter-spacing: .02em; }
.stat b { display: block; font: 400 30px/1.15 var(--f-display); color: var(--ink); margin: 8px 0 4px; }
.stat p { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
/* text editor */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
.tabs button { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tx { background: #fff; border: 1px solid var(--line); padding: 12px 14px; }
.tx.changed { border-left: 3px solid var(--terra); }
.tx-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 6px; }
.tx-top span { font: 600 11px/1.3 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tx textarea { min-height: 44px; }
.hint { background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--gold); padding: 10px 14px; margin-bottom: 16px; color: var(--text); font-size: 13px; }
/* images */
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.img-card { background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; }
.img-card .ph { aspect-ratio: 4 / 3; background: var(--sand) center / cover no-repeat; position: relative; }
.img-card .ph .chip { position: absolute; left: 8px; top: 8px; }
.img-card .meta { padding: 10px 12px; display: grid; gap: 8px; }
.img-card .meta b { font-size: 12.5px; color: var(--ink); word-break: break-word; }
/* lists */
.item { background: #fff; border: 1px solid var(--line); padding: 16px; }
.item-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.item-head h3 { font-size: 18px; }
.picker { display: flex; align-items: center; gap: 10px; }
.picker .thumb { width: 64px; height: 48px; background: var(--sand) center / cover no-repeat; border: 1px solid var(--line); flex: none; display: grid; place-items: center; font: 700 10px/1 var(--f-body); color: var(--muted); }
.picker input { flex: 1; }
/* table */
.table-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: #FBFAF7; position: sticky; top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #FBFAF7; }
td input, td select { padding: 7px 8px; }
/* media */
.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.mfile { background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; }
.mfile .ph { aspect-ratio: 4 / 3; background: var(--sand) center / contain no-repeat; display: grid; place-items: center; font: 700 13px/1 var(--f-body); color: var(--muted); }
.mfile .meta { padding: 8px 10px; font-size: 12px; display: grid; gap: 6px; }
.mfile .meta b { word-break: break-all; font-weight: 600; color: var(--ink); font-size: 11.5px; }
/* dialogs and drawer */
dialog { border: 0; padding: 0; width: min(760px, calc(100% - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 40px 100px -30px rgba(0, 0, 0, .55); }
dialog::backdrop { background: rgba(19, 43, 45, .55); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 1; }
.dlg-head h2 { font-size: 22px; }
.dlg-body { padding: 18px 20px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: #FBFAF7; position: sticky; bottom: 0; }
.mapbox { position: relative; background: #738579; cursor: crosshair; }
.mapbox svg { display: block; width: 100%; height: auto; }
.mapbox .pin { position: absolute; width: 18px; height: 18px; margin: -18px 0 0 -9px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--terra); border: 2px solid #fff; pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 30px); opacity: 0; z-index: 100; background: var(--ink); color: #fff; padding: 12px 18px; font-weight: 600; font-size: 13px; transition: opacity .25s, transform .3s; max-width: calc(100% - 32px); box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .5); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--bad); }
.loading { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--sand); border-top-color: var(--terra); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { height: 4px; background: var(--sand); margin-top: 8px; } .progress i { display: block; height: 100%; width: 0; background: var(--terra); transition: width .2s; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 20; transform: translateX(-100%); transition: transform .3s; }
  .side.open { transform: none; box-shadow: 0 0 60px rgba(0, 0, 0, .4); }
  .menu-btn { display: inline-flex; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .content { padding: 22px 16px 80px; }
  .bar { padding: 10px 16px; }
}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="spinner"></div>Loading the Falcon Manor CMS…</div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<iframe id="harvest" title="Site content loader" hidden></iframe>

<script type="module">
// Falcon Manor CMS. Talks to /api/admin; content edits stay in a local draft until Publish.
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const clone = (o) => JSON.parse(JSON.stringify(o));
const fmtDate = (ts) => ts ? new Date(ts).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : '';
const PAGES = [['home', 'Home'], ['community', 'Community'], ['homes', 'Homes'], ['lifestyle', 'Lifestyle'], ['relocation', 'Relocation'], ['schools', 'Schools'], ['news', 'News'], ['hoa', 'HOA & Tax Rates'], ['residents', 'Residents'], ['realtors', 'Realtors'], ['contact', 'Contact'], ['footer', 'Footer'], ['site', 'Site-wide']];
const SOCIALS = [['instagram', 'Instagram'], ['facebook', 'Facebook'], ['x', 'X (Twitter)'], ['linkedin', 'LinkedIn']];
const WORK_KEY = 'fm-cms-work', PREVIEW_KEY = 'fm-cms-draft';
const S = { status: null, authed: false, published: null, versions: [], draft: null, H: null, leads: null, media: null, view: 'dashboard', page: 'home', q: '', faqCat: 'all', leadFilter: 'all', leadQ: '' };

// ---------- helpers ----------
let toastT;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }
async function api(action, opts = {}) {
  const r = await fetch('/api/admin?a=' + action + (opts.query || ''), { method: opts.body ? 'POST' : 'GET', headers: opts.body ? { 'Content-Type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: 'same-origin' });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && action !== 'login') { S.authed = false; render(); throw new Error(d.error || 'Please sign in again.'); }
  if (!r.ok) throw new Error(d.error || ('Request failed (' + r.status + ')'));
  return d;
}
const isDirty = () => JSON.stringify(S.draft || {}) !== JSON.stringify(normalize(S.published));
function normalize(c) { const o = clone(c || {}); delete o._meta; return o; }
function touch() { try { localStorage.setItem(WORK_KEY, JSON.stringify({ base: S.published && S.published._meta ? S.published._meta.savedAt : 0, draft: S.draft })); } catch (e) {} renderBar(); }
function dflt(key) { return S.H ? S.H.defaults[key] : undefined; }
// Collections start from the site's built-in content until first edited
function list(key) { const v = S.draft[key]; return Array.isArray(v) && v.length ? v : clone(dflt(key) || []); }
function setList(key, arr) { S.draft[key] = arr; touch(); }
function settings() { return Object.assign({ avaniUrl: '', phone: '', email: '', office: '', hours: '', ribbonText: '', ribbonHide: false, brochurePdf: '', brochurePages: [], mapboxToken: '', schoolsVideo: '' }, S.draft.settings || {}); }
// Homesites: only edited rows are stored; everything else stays 'Available, coming soon'
const LOT_ST = [['coming', 'Available · coming soon'], ['available', 'Available'], ['reserved', 'Reserved'], ['sold', 'Sold'], ['model', 'Model home'], ['hold', 'On hold']];
const LOT_STYLES = ['Modern Farmhouse', 'Texas Hill Country', 'French Country', 'Modern Prairie', 'Traditional', 'Mediterranean', 'Contemporary'];
const lotDefault = (id) => (((S.H && S.H.defaults.lots) || []).find((x) => x.id === id) || {}).st || 'coming';
function lotOf(id) { return Object.assign({ id, status: lotDefault(id), builder: '', price: '', note: '', phase: 0, style: '', beds: 0, avail: 'coming' }, (S.draft.lots || []).find((l) => l.id === id) || {}); }
function setLot(id, f, v) { const o = lotOf(id); o[f] = f === 'phase' || f === 'beds' ? +v || 0 : v; const L = (S.draft.lots || []).filter((l) => l.id !== id); if (o.status !== lotDefault(id) || o.builder || o.price || o.note || o.phase || o.style || o.beds || o.avail === 'ready') L.push(o); S.draft.lots = L; touch(); }
function setSetting(k, v) { S.draft.settings = Object.assign(settings(), { [k]: v }); touch(); }

// ---------- boot ----------
async function boot() {
  try { const s = await api('session'); S.status = s.configured; S.authed = s.authed; } catch (e) { S.status = null; }
  if (S.authed) await loadAll(); else render();
}
async function loadAll() {
  render('Loading content…');
  try {
    const [c] = await Promise.all([api('content'), harvest()]);
    S.published = c.content; S.versions = c.versions;
    S.draft = normalize(c.content);
    try { const w = JSON.parse(localStorage.getItem(WORK_KEY) || 'null'); const base = S.published && S.published._meta ? S.published._meta.savedAt : 0; if (w && w.draft && w.base === base && JSON.stringify(w.draft) !== JSON.stringify(S.draft)) { S.draft = w.draft; setTimeout(() => toast('Restored your unsaved changes from last time.'), 400); } } catch (e) {}
    api('leads').then((d) => { S.leads = d.leads; renderSide(); if (S.view === 'dashboard' || S.view === 'leads') renderView(); }).catch(() => {});
    render();
  } catch (e) { render(); toast(e.message, true); }
}
// The site's own editable text, images and built-in collections, read from the page itself
function harvest() {
  if (S.H) return Promise.resolve(S.H);
  return new Promise((ok, fail) => {
    const f = $('#harvest'), t0 = Date.now();
    f.src = '/?cms-harvest=1&t=' + Date.now();
    (function poll() {
      try { const h = f.contentWindow && f.contentWindow.FM_HARVEST; if (h) { S.H = JSON.parse(JSON.stringify(h)); f.src = 'about:blank'; return ok(S.H); } } catch (e) {}
      if (Date.now() - t0 > 25000) return fail(new Error('Could not read the site content. Reload to try again.'));
      setTimeout(poll, 250);
    })();
  });
}

// ---------- rendering ----------
const NAV = [
  ['Overview', [['dashboard', 'Dashboard']]],
  ['Website content', [['texts', 'Pages & text'], ['images', 'Images'], ['builders', 'Meet our builders'], ['news', 'News & updates'], ['videos', 'Videos'], ['faq', 'FAQ'], ['places', 'Area map places'], ['lots', 'Homesites'], ['owners', 'HOA & taxes'], ['more', 'Additional information']]],
  ['Settings', [['contact', 'Contact & social'], ['settings', 'Site settings']]],
  ['Manage', [['leads', 'Registrations'], ['media', 'Media library'], ['history', 'History']]]
];
function render(loadingMsg) {
  const app = $('#app');
  if (!S.status) { app.innerHTML = gate('<h1>Unavailable</h1><p>The admin service could not be reached. Check the deployment and reload.</p>'); return; }
  if (!S.status.password || !S.status.store) { app.innerHTML = setupGate(); return; }
  if (!S.authed) { app.innerHTML = gate('<h1>Sign in</h1><p>Falcon Manor content management</p><form id="login"><label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required autofocus></label><button class="btn primary" type="submit" style="width:100%">Sign in</button><p id="login-err" style="color:var(--bad);margin:12px 0 0" hidden></p></form>'); return; }
  if (loadingMsg || !S.draft) { app.innerHTML = '<div class="loading"><div><div class="spinner"></div>' + esc(loadingMsg || 'Loading…') + '</div></div>'; return; }
  app.innerHTML = '<div class="shell"><aside class="side" id="side"></aside><div class="main"><div class="bar" id="bar"></div><div class="content" id="view"></div></div></div>';
  renderSide(); renderBar(); renderView();
}
function gate(inner) { return '<div class="gate"><div class="gate-card"><div class="mark"><img src="/favicon.svg" alt=""><b>FALCON MANOR</b></div>' + inner + '</div></div>'; }
function setupGate() {
  const st = S.status, li = (ok, t) => '<li>' + (ok ? '<span class="chip ok">Done</span> ' : '<span class="chip warn">To do</span> ') + t + '</li>';
  return gate('<h1>Finish setup</h1><p>Two settings in the Vercel project turn the CMS on. Then redeploy.</p><ol>' +
    li(st.store, 'Storage: in Vercel, open the project, then <b>Storage</b>, create a <b>Blob</b> store and connect it to this project.') +
    li(st.password, 'Password: in <b>Settings → Environment Variables</b>, add <code>ADMIN_PASSWORD</code>.') +
    li(st.secret, 'Recommended: add <code>ADMIN_SECRET</code>, a long random value that protects sessions and registrations.') + '</ol>');
}
function renderSide() {
  const side = $('#side'); if (!side) return;
  const newLeads = (S.leads || []).filter((l) => l.status === 'new').length;
  side.innerHTML = '<a class="brand" href="/" target="_blank" rel="noopener"><img src="/favicon.svg" alt=""><span><b>FALCON MANOR</b><small>CONTENT MANAGER</small></span></a>' +
    NAV.map(([h, items]) => '<h4>' + h + '</h4>' + items.map(([k, label]) => '<button type="button" data-nav="' + k + '"' + (S.view === k ? ' aria-current="page"' : '') + '><span>' + label + '</span>' + (k === 'leads' && newLeads ? '<span class="count">' + newLeads + '</span>' : '') + '</button>').join('')).join('') +

    (choose ? '<button class="btn sm primary" data-act="pick-choose" data-url="' + esc(f.url) + '">Choose</button>' : '<button class="btn sm" data-act="media-copy" data-url="' + esc(f.url) + '">Copy link</button><button class="btn sm danger" data-act="media-del" data-url="' + esc(f.url) + '">Delete</button>') + '</div></div></div>';

async function loadMedia() { try { S.media = (await api('media')).files; } catch (e) { S.media = []; toast(e.message, true); } if (['media'].includes(S.view)) renderView(); return S.media; }
let blobClient = null;
async function uploadOne(file, onProgress) {
  const safe = file.name.toLowerCase().replace(/[^a-z0-9.\-_]+/g, '-').replace(/^-+/, '').slice(-80) || 'file';
  if (S.status.blob) {
    blobClient = blobClient || await import('https://esm.sh/@vercel/blob@2.8.2/client');
    const r = await blobClient.upload('media/' + safe, file, { access: 'public', handleUploadUrl: '/api/admin?a=upload', multipart: file.size > 8 * 1024 * 1024, onUploadProgress: (p) => onProgress && onProgress(p.percentage) });
    return { url: r.url, pathname: r.pathname, size: file.size, uploadedAt: Date.now() };
  }
  const r = await fetch('/api/admin?a=upload-local&name=' + encodeURIComponent(safe), { method: 'PUT', headers: { 'Content-Type': file.type }, body: file, credentials: 'same-origin' });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Upload failed');
  onProgress && onProgress(100);
  return { url: d.url, pathname: d.pathname, size: file.size, uploadedAt: Date.now() };
}
async function uploadFiles(files, box) {
  const done = [];
  for (const f of files) {
    if (!/^(image\/(jpeg|png|webp|svg\+xml)|application\/pdf)$/.test(f.type)) { toast(f.name + ': only JPG, PNG, WebP, SVG or PDF files.', true); continue; }
    if (f.size > 25 * 1024 * 1024) { toast(f.name + ' is larger than 25 MB.', true); continue; }
    if (box) box.innerHTML = '<div class="card"><b>Uploading ' + esc(f.name) + '</b><div class="progress"><i></i></div></div>';
    try { done.push(await uploadOne(f, (p) => { const i = box && $('.progress i', box); if (i) i.style.width = p + '%'; })); } catch (e) { toast(f.name + ': ' + e.message, true); }
  }
  if (box) box.innerHTML = '';
  if (done.length) { S.media = (S.media || []).length ? done.concat(S.media) : null; toast(done.length === 1 ? 'Uploaded.' : done.length + ' files uploaded.'); }
  return done;
}

      case 'dlg-close': if (dlgMode === 'picker' && pickTarget && pickTarget.group === 'news') { pickTarget = null; openNews(newsIndex, true); break; } $('#dlg').close(); dlgMode = ''; if (S.view === 'places') renderView(); break;
      case 'mb-add': { const L = list('meet'); L.push({ id: 'builder-' + (L.length + 1), name: 'New builder', title: '', text: '', logo: '', url: '' }); setList('meet', L); renderView(); break; }
      case 'mb-del': { const L = list('meet'); if (L.length <= 1) { toast('Keep at least one builder.', true); break; } if (!confirm('Remove ' + (L[i].name || 'this builder') + '?')) break; L.splice(i, 1); setList('meet', L); renderView(); break; }
      case 'mb-move': move('meet'); break;
      case 'news-add': S.view = 'news'; renderSide(); renderView(); openNews(-1); break;
      case 'news-edit': openNews(i); break;
      case 'news-save': {
        if (!String(newsDraft.t || '').trim()) { toast('Add a title first.', true); break; }
        const L = list('news'); if (newsIndex >= 0) L[newsIndex] = newsDraft; else L.unshift(newsDraft); setList('news', L); $('#dlg').close(); renderView(); toast(newsIndex >= 0 ? 'Story updated.' : 'Story added.'); break;
      }
      case 'news-del': { const L = list('news'); if (!confirm('Delete “' + L[i].t + '”?')) break; L.splice(i, 1); setList('news', L.length ? L : []); renderView(); break; }
      case 'news-move': move('news'); break;
      case 'vid-add': { const L = list('videos'); L.unshift({ page: 'schools', t: 'New video', d: '', url: '', img: '' }); setList('videos', L); renderView(); break; }
      case 'vid-del': { const L = list('videos'); if (!confirm('Delete “' + L[i].t + '”?')) break; L.splice(i, 1); setList('videos', L); renderView(); break; }
      case 'vid-move': move('videos'); break;
      case 'faq-add': { const L = list('faq'); L.push([S.faqCat === 'all' ? 0 : +S.faqCat, 'New question', '']); setList('faq', L); renderView(); const last = $$('[data-faq][data-f="1"]').pop(); if (last) { last.focus(); last.select(); } break; }
      case 'faq-del': { const L = list('faq'); if (L.length <= 1) { toast('Keep at least one question.', true); break; } if (!confirm('Delete this question?')) break; L.splice(i, 1); setList('faq', L); renderView(); break; }
      case 'faq-move': move('faq'); break;
      case 'pl-add': { const L = list('places'); L.unshift(['New place', Object.keys(S.H.defaults.mapcat)[0], 250, 320]); setList('places', L); renderView(); openMap(0); break; }
      case 'pl-del': { const L = list('places'); if (L.length <= 1) { toast('Keep at least one place.', true); break; } if (!confirm('Delete ' + L[i][0] + '?')) break; L.splice(i, 1); setList('places', L); renderView(); break; }
      case 'pl-pick': openMap(i); break;
      case 'leads-refresh': await refreshLeads(); toast('Registrations refreshed.'); break;
      case 'leads-csv': csv(); break;
      case 'lead-open': openLead(b.dataset.id); break;
      case 'lead-status': { const r = await api('lead', { body: { id: b.dataset.id, status: b.dataset.s, note: ($('#lead-note') || {}).value } }); replaceLead(r.lead); openLead(r.lead.id); renderSide(); toast('Marked ' + r.lead.status + '.'); break; }
      case 'lead-note': { const r = await api('lead', { body: { id: b.dataset.id, note: $('#lead-note').value } }); replaceLead(r.lead); toast('Note saved.'); break; }
      case 'lead-del': { if (!confirm('Delete this registration permanently?')) break; await api('lead-delete', { body: { id: b.dataset.id } }); S.leads = S.leads.filter((l) => l.id !== b.dataset.id); $('#dlg').close(); renderSide(); renderView(); toast('Registration deleted.'); break; }
      case 'media-copy': { const u = new URL(b.dataset.url, location.origin).href; await navigator.clipboard.writeText(u).then(() => toast('Link copied.'), () => prompt('Copy this link:', u)); break; }
      case 'media-del': { if (!confirm('Delete ' + fname(b.dataset.url) + '? Pages using it will show the original image instead.')) break; await api('media-delete', { body: { url: b.dataset.url } }); S.media = S.media.filter((f) => f.url !== b.dataset.url); renderView(); toast('File deleted.'); break; }
      case 'ver-preview': { const r = await api('version', { query: '&p=' + encodeURIComponent(b.dataset.p) }); localStorage.setItem(PREVIEW_KEY, JSON.stringify(normalize(r.content))); window.open('/?cms-preview=1', '_blank', 'noopener'); break; }
      case 'ver-restore': {
        if (isDirty() && !confirm('You have unsaved changes. Restoring replaces them. Continue?')) break;
        if (!confirm('Make this version live again?')) break;
        await api('restore', { body: { pathname: b.dataset.p } }); const c = await api('content'); S.published = c.content; S.versions = c.versions; S.draft = normalize(c.content); localStorage.removeItem(WORK_KEY); renderBar(); renderView(); toast('Restored and published.'); break;
      }
    }
  } catch (x) { toast(x.message, true); b.disabled = false; }
});
// Clicking the area map sets the place's position
document.addEventListener('click', (e) => {
  const box = e.target.closest('#mapbox'); if (!box || mapIndex < 0) return;
  const r = box.getBoundingClientRect(), x = 20 + (e.clientX - r.left) / r.width * 460, y = 140 + (e.clientY - r.top) / r.height * 350;
  const L = list('places'); L[mapIndex][2] = Math.round(x * 10) / 10; L[mapIndex][3] = Math.round(y * 10) / 10; setList('places', L); placePin(x, y);
});
function openPublish() {
  const dlg = $('#dlg');
  dlg.innerHTML = '<div class="dlg-head"><h2>Publish changes</h2><button class="btn sm" data-act="dlg-close">Close</button></div><div class="dlg-body"><p style="margin-top:0">Your changes go live on the site within about a minute. The current version stays in History, so you can restore it.</p><label class="field" style="margin:0"><span>Note (optional)</span><input type="text" id="pub-note" maxlength="140" placeholder="e.g. Added builder details"></label></div><div class="dlg-foot"><button class="btn" data-act="dlg-close">Cancel</button><button class="btn primary" data-act="do-publish">Publish now</button></div>';
  dlg.showModal(); setTimeout(() => $('#pub-note').focus(), 50);
}
async function refreshLeads() { try { S.leads = (await api('leads')).leads; } catch (e) { S.leads = S.leads || []; toast(e.message, true); } renderSide(); if (S.view === 'leads' || S.view === 'dashboard') renderView(); }
function replaceLead(l) { S.leads = S.leads.map((x) => x.id === l.id ? l : x); if (S.view === 'leads') renderView(); }
window.addEventListener('beforeunload', (e) => { if (S.draft && isDirty()) { e.preventDefault(); e.returnValue = ''; } });
boot();
</script>
